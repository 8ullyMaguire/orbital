<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: #07080f; color: #e8e9f2; }
  a { color: inherit; text-decoration: none; }
  .w { padding: 10px; }
  .hd { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .hd b { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #9aa0bd; }
  .hd span { font-size: 11px; color: #6f7592; }
  ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  li a { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; }
  li a:hover { background: #12152a; }
  .n { width: 14px; font-size: 11px; color: #6f7592; font-variant-numeric: tabular-nums; }
  .av { width: 22px; height: 22px; border-radius: 6px; flex: 0 0 22px; display: grid; place-items: center;
        font-size: 9px; font-weight: 700; color: #07080f;
        background: linear-gradient(135deg, var(--a, #7c5cff), var(--b, #26304f)); }
  .t { min-width: 0; flex: 1; }
  .t b { display: block; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t small { display: block; font-size: 11px; color: #6f7592; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .s { font-size: 11px; color: #8e94b3; font-variant-numeric: tabular-nums; }
  .join { display: block; margin-top: 10px; padding: 8px; text-align: center; border-radius: 9px;
          border: 1px solid #262a45; font-size: 12px; color: #cfd3ea; background: #0d1020; }
  .join:hover { border-color: #3a3f68; color: #fff; }
  .join b { color: #a48bff; }
  .empty { padding: 18px 6px; font-size: 12px; color: #6f7592; text-align: center; }
</style>
</head>
<body>
<div class="w">
  <div class="hd"><b>{{ title }}</b><span>{{ subtitle }}</span></div>
  {% if members.len() == 0 %}
    <p class="empty">No traffic measured yet.</p>
  {% else %}
  <ol>
    {% for m in members %}
    <li><a href="{{ m.url }}" target="_blank" rel="noopener">
      <span class="n">{{ m.rank }}</span>
      {{ m.avatar_mini|safe }}
      <span class="t"><b>{{ m.display_name }}</b><small>@{{ m.handle }}</small></span>
      <span class="s">{{ m.stat_value }}</span>
    </a></li>
    {% endfor %}
  </ol>
  {% endif %}
  <a class="join" href="{{ join_url }}" target="_blank" rel="noopener">Get listed in <b>{{ title }}</b> →</a>
</div>
</body>
</html>
