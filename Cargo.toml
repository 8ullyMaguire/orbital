[package]
name = "orbital"
version = "0.1.0"
edition = "2021"
description = "Orbital — themed verticals of people and their links"
license = "MIT"

[dependencies]
commons-feed = { path = "../commons/crates/commons-feed" }
# The estate's candidate generation: named sources, validated budgets, capped blends, MMR and soft
# floors. Extracted from kindred and already run by darkhold; orbital deletes its own home-page loop
# rather than keeping a fourth implementation of the same arithmetic (DECISIONS D31).
polaris-candidates = { path = "../../polaris-candidates" }
# Where an instance's taste comes from: eight evidence words, six selectors, a validated
# declaration, decay, and a fold that carries provenance and a per-source report. D30 fixes orbital's
# sources; the arithmetic is the estate's (D31: adopt it and delete our copy).
polaris-taste-source = { path = "../../polaris-taste-source" }
# The reader's dial: one number per person, narrowing a declared ceiling and never widening it.
# Extracted from darkhold; orbital adopts the arithmetic rather than writing a fourth dial (D31).
polaris-gravity = { path = "../../polaris-gravity" }
# The estate's ranking metrics and the paired bootstrap: nDCG@10, recall@50, and the decision
# rule that refuses to call a difference a result below the sample floor (D31).
polaris-eval = { path = "../../polaris-eval" }
axum = { version = "0.8", features = ["macros"] }
askama = "0.16"
askama_web = { version = "0.16", features = ["axum-0.8"] }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio-rustls",
  "postgres",
  "uuid",
  "chrono",
  "migrate",
  "macros",
] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["compression-gzip", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
argon2 = "0.5"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
rust-embed = "8"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
